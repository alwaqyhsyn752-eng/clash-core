<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Clash of Armored - Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0d0d0d; touch-action: none; }
    canvas { display: block; }

    /* أزرار التحكم */
    .controls {
      position: fixed;
      bottom: 20px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-between;
      pointer-events: none;
    }
    .pad {
      display: grid;
      grid-template-columns: repeat(3, 60px);
      grid-template-rows: repeat(2, 60px);
      gap: 8px;
      pointer-events: auto;
    }
    .btn-ctrl {
      background: rgba(90, 110, 61, 0.85);
      border: 2px solid #7d9556;
      color: #fff;
      font-size: 24px;
      border-radius: 12px;
      cursor: pointer;
      user-select: none;
    }
    .btn-ctrl:active { background: rgba(255, 123, 0, 0.9); }
    .empty { visibility: hidden; }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <div class="controls">
    <!-- يسار: دوران -->
    <div class="pad">
      <button class="btn-ctrl" data-dir="left">↺</button>
      <button class="btn-ctrl empty"></button>
      <button class="btn-ctrl" data-dir="right">↻</button>
    </div>

    <!-- يمين: للأمام/الخلف -->
    <div class="pad" style="grid-template-columns: repeat(1, 70px); grid-template-rows: repeat(2, 70px);">
      <button class="btn-ctrl" data-dir="up">▲</button>
      <button class="btn-ctrl" data-dir="down">▼</button>
    </div>
  </div>

  <script src="src/maps/test-map.js"></script>
  <script src="src/entities/tank.js"></script>
  <script src="src/game.js"></script>
</body>
</html>
